services:
  carkeeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DATABASE_URL: postgres://carkeeper:${POSTGRES_PASSWORD}@postgres:5432/carkeeper
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-BYN}
      NODE_ENV: production
      BOT_MODE: polling
      PORT: 3000
      REMINDER_CHECK_INTERVAL_MINUTES: ${REMINDER_CHECK_INTERVAL_MINUTES:-1440}
      WEBHOOK_URL:
      WEBHOOK_SECRET:
    expose:
      - "3000"
    command: sh -c "npm run migrate:up && npm run start"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carkeeper
      POSTGRES_USER: carkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - carkeeper_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U carkeeper -d carkeeper" ]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  carkeeper_postgres_data:
